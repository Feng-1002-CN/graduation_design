spring:
  datasource:
    url: jdbc:h2:mem:competition;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  storage:
    provider: filesystem
    local-directory: ${LOCAL_STORAGE_DIRECTORY:./target/local-storage}
  embedding:
    provider: local
  vector:
    provider: database

logging:
  level:
    com.graduation.competition: DEBUG

